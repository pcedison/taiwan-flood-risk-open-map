version: source-registry/v1

# This is the canonical enablement-decision registry. Runtime code, database
# catalog rows, deployment defaults, and documentation remain separate
# execution surfaces, but CI rejects any drift from the decisions recorded
# here. A source being listed does not mean it is enabled or complete.
contracts:
  central_official: docs/data-sources/official/official-source-catalog.yaml
  civil_iot: docs/data-sources/official/civil-iot-sensorthings-integration.md
  incident_activation: docs/runbooks/safe-fast-official-incident-activation.md
  local_realtime: docs/data-sources/local/taiwan-local-realtime-water-source-matrix.md
  nationwide_history: docs/data-sources/official/nationwide-recent-flood-history.md
  tainan_history: docs/data-sources/official/tainan-disaster-news.md
  news_allowlist: docs/data-sources/news/l2-source-allowlist.yaml
  news_enrichment: docs/data-sources/news/README.md
  forum_approval: docs/data-sources/forum/source-approval-manifest.yaml


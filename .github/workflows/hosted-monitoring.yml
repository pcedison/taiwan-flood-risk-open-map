name: Hosted Monitoring

on:
  workflow_dispatch:
    inputs:
      expected_deployment_sha:
        description: "Expected /health deployment_sha. Defaults to main branch HEAD."
        required: false
        type: string
      require_admin_source_freshness:
        description: "Fail the workflow when ADMIN_BEARER_TOKEN is missing instead of skipping /admin/v1/sources freshness evidence."
        required: false
        default: false
        type: boolean
      fail_on_overdue_local_source_followups:
        description: "Fail when private local-source request dispatch evidence contains overdue official follow-ups."
        required: false
        default: false
        type: boolean
      data_source_mode:
        description: "strict fails when official realtime sources produce no evidence. degraded-ok reports that as degraded while still failing on public API contract regressions."
        required: false
        default: "degraded-ok"
        type: choice
        options:
          - degraded-ok
          - strict
  # Every 6 hours. The previous 7,37 * * * * cadence produced 48 scheduled runs a
  # day (plus 48 watchdog fallback dispatches) against a deployment whose state
  # changes far more slowly than that.
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: hosted-monitoring
  cancel-in-progress: false

jobs:
  hosted-monitoring:
    name: Hosted monitoring smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ADMIN_BEARER_TOKEN: ${{ secrets.ADMIN_BEARER_TOKEN }}
      HOSTED_WORKER_EVIDENCE_MANIFEST_B64: ${{ secrets.HOSTED_WORKER_EVIDENCE_MANIFEST_B64 }}
      HOSTED_WORKER_POLICY_EVIDENCE_MANIFEST_B64: ${{ secrets.HOSTED_WORKER_POLICY_EVIDENCE_MANIFEST_B64 }}
      HOSTED_MONITORING_EVIDENCE_MANIFEST_B64: ${{ secrets.HOSTED_MONITORING_EVIDENCE_MANIFEST_B64 }}
      LOCAL_SOURCE_REQUEST_DISPATCH_EVIDENCE_B64: ${{ secrets.LOCAL_SOURCE_REQUEST_DISPATCH_EVIDENCE_B64 }}
      # Scheduled runs no longer force this on. ADMIN_BEARER_TOKEN is an optional
      # private-evidence secret; forcing it made every scheduled run fail on a
      # missing secret rather than on a real hosted regression. Release and audit
      # runs opt in through the workflow_dispatch input.
      REQUIRE_ADMIN_SOURCE_FRESHNESS: ${{ github.event.inputs.require_admin_source_freshness || 'false' }}
      FAIL_ON_OVERDUE_LOCAL_SOURCE_FOLLOWUPS: ${{ github.event.inputs.fail_on_overdue_local_source_followups || 'false' }}
      DATA_SOURCE_MODE: ${{ github.event.inputs.data_source_mode || 'degraded-ok' }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Resolve expected deployment SHA
        id: expected-sha
        env:
          INPUT_EXPECTED_DEPLOYMENT_SHA: ${{ github.event.inputs.expected_deployment_sha }}
        run: |
          set -euo pipefail
          source="workflow_dispatch_input"
          expected_sha="${INPUT_EXPECTED_DEPLOYMENT_SHA:-}"
          if [ -z "${expected_sha}" ]; then
            source="main"
            expected_sha="$(git ls-remote --heads origin main | awk '{print $1}' || true)"
          fi
          if [ -z "${expected_sha}" ]; then
            source="workflow_commit_sha"
            expected_sha="${GITHUB_SHA}"
          fi
          echo "sha=${expected_sha}" >> "${GITHUB_OUTPUT}"
          echo "Expected hosted deployment SHA (${source}): ${expected_sha}"

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Public API contract probe
        run: |
          set -euo pipefail
          python scripts/public-api-contract-probe.py \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --allow-insecure-tls \
            --output artifacts/public-api-contract-probe.json

      - name: Hosted deployment smoke
        run: |
          set -euo pipefail
          python scripts/hosted_deployment_smoke.py \
            --expected-deployment-sha "${{ steps.expected-sha.outputs.sha }}" \
            --retry-count 6 \
            --retry-delay-seconds 45 \
            --evidence-output artifacts/hosted-deployment-smoke.json \
            --completion-evidence-output artifacts/hosted-deployment-completion-evidence.json

      - name: Hosted public risk evidence smoke
        run: |
          set -euo pipefail
          python scripts/hosted_public_risk_evidence_smoke.py \
            --data-source-mode "${DATA_SOURCE_MODE}" \
            --evidence-output artifacts/hosted-public-risk-evidence-smoke.json \
            --completion-evidence-output artifacts/hosted-public-risk-completion-evidence.json

      - name: Set up Node for hosted Web UI smoke
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install hosted Web UI smoke dependencies
        run: npm ci --prefer-offline
        working-directory: apps/web

      - name: Install hosted Web UI smoke browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Hosted Web UI basemap and query smoke
        env:
          HOSTED_WEB_BASE_URL: https://floodrisk.cc
        run: npm run e2e:hosted
        working-directory: apps/web

      - name: Local source signal-gap discovery refresh
        run: |
          set -euo pipefail
          python scripts/local-source-signal-gap-discovery-refresh.py \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --allow-fetch-failure \
            --output-dir artifacts

      - name: Local source signal-gap dispatch readiness
        run: |
          set -euo pipefail
          python scripts/local-source-signal-gap-dispatch-readiness.py \
            --discovery-summary-json artifacts/signal-gap-discovery-refresh-summary.json \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output artifacts/signal-gap-dispatch-readiness.json

      - name: Local source contract dispatch readiness
        run: |
          set -euo pipefail
          python scripts/local-source-contract-dispatch-readiness.py \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output artifacts/source-contract-dispatch-readiness.json

      - name: Local source request packet bundle
        run: |
          set -euo pipefail
          python scripts/local-source-request-packet-bundle.py \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output-dir artifacts

      - name: Hosted private evidence readiness
        run: |
          set -euo pipefail
          python scripts/hosted_private_evidence_readiness.py \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output artifacts/hosted-private-evidence-readiness.json

      - name: Hosted private evidence template bundle
        run: |
          set -euo pipefail
          python scripts/hosted_private_evidence_template_bundle.py \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output-dir artifacts

      - name: Require admin source freshness token
        if: ${{ env.REQUIRE_ADMIN_SOURCE_FRESHNESS == 'true' && env.ADMIN_BEARER_TOKEN == '' }}
        run: |
          echo "::error title=ADMIN_BEARER_TOKEN is required::Set the ADMIN_BEARER_TOKEN repository secret or disable require_admin_source_freshness for non-release monitoring runs."
          exit 1

      - name: Hosted source freshness smoke
        if: ${{ env.ADMIN_BEARER_TOKEN != '' }}
        run: |
          set -euo pipefail
          python scripts/hosted_source_freshness_smoke.py \
            --admin-token-env ADMIN_BEARER_TOKEN \
            --evidence-output artifacts/hosted-source-freshness-smoke.json \
            --completion-evidence-output artifacts/hosted-source-freshness-completion-evidence.json

      - name: Skip admin freshness smoke without token
        if: ${{ env.ADMIN_BEARER_TOKEN == '' && env.REQUIRE_ADMIN_SOURCE_FRESHNESS != 'true' }}
        run: |
          {
            echo "### Hosted private evidence skipped"
            echo "- \`ADMIN_BEARER_TOKEN\` is not configured, so /admin/v1/sources freshness evidence was not collected."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Hosted source freshness skipped because ADMIN_BEARER_TOKEN is not configured."

      - name: Hosted worker private evidence
        if: ${{ env.HOSTED_WORKER_EVIDENCE_MANIFEST_B64 != '' }}
        run: |
          set -euo pipefail
          worker_manifest="${RUNNER_TEMP}/hosted-worker-evidence-manifest.json"
          printf '%s' "${HOSTED_WORKER_EVIDENCE_MANIFEST_B64}" | base64 --decode > "${worker_manifest}"
          python scripts/hosted_worker_evidence.py \
            --manifest-json "${worker_manifest}" \
            --evidence-output artifacts/hosted-worker-evidence.json \
            --completion-evidence-output artifacts/hosted-worker-completion-evidence.json

      - name: Skip hosted worker private evidence without manifest
        if: ${{ env.HOSTED_WORKER_EVIDENCE_MANIFEST_B64 == '' }}
        run: |
          {
            echo "### Hosted private evidence skipped"
            echo "- \`HOSTED_WORKER_EVIDENCE_MANIFEST_B64\` is not configured, so hosted_worker_persisted_evidence was not collected."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Hosted worker private evidence skipped because HOSTED_WORKER_EVIDENCE_MANIFEST_B64 is not configured."

      - name: Hosted worker policy private evidence
        if: ${{ env.HOSTED_WORKER_POLICY_EVIDENCE_MANIFEST_B64 != '' }}
        run: |
          set -euo pipefail
          worker_policy_manifest="${RUNNER_TEMP}/hosted-worker-policy-evidence-manifest.json"
          printf '%s' "${HOSTED_WORKER_POLICY_EVIDENCE_MANIFEST_B64}" | base64 --decode > "${worker_policy_manifest}"
          python scripts/hosted_worker_policy_evidence.py \
            --manifest-json "${worker_policy_manifest}" \
            --evidence-output artifacts/hosted-worker-policy-evidence.json \
            --completion-evidence-output artifacts/hosted-worker-policy-completion-evidence.json

      - name: Skip hosted worker policy private evidence without manifest
        if: ${{ env.HOSTED_WORKER_POLICY_EVIDENCE_MANIFEST_B64 == '' }}
        run: |
          {
            echo "### Hosted private evidence skipped"
            echo "- \`HOSTED_WORKER_POLICY_EVIDENCE_MANIFEST_B64\` is not configured, so raw snapshot retention, scheduler cadence, and hosted egress policy evidence were not collected."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Hosted worker policy private evidence skipped because HOSTED_WORKER_POLICY_EVIDENCE_MANIFEST_B64 is not configured."

      - name: Hosted monitoring private evidence
        if: ${{ env.HOSTED_MONITORING_EVIDENCE_MANIFEST_B64 != '' }}
        run: |
          set -euo pipefail
          monitoring_manifest="${RUNNER_TEMP}/hosted-monitoring-evidence-manifest.json"
          printf '%s' "${HOSTED_MONITORING_EVIDENCE_MANIFEST_B64}" | base64 --decode > "${monitoring_manifest}"
          python scripts/hosted_monitoring_evidence.py \
            --manifest-json "${monitoring_manifest}" \
            --evidence-output artifacts/hosted-monitoring-evidence.json \
            --completion-evidence-output artifacts/hosted-monitoring-completion-evidence.json

      - name: Skip hosted monitoring private evidence without manifest
        if: ${{ env.HOSTED_MONITORING_EVIDENCE_MANIFEST_B64 == '' }}
        run: |
          {
            echo "### Hosted private evidence skipped"
            echo "- \`HOSTED_MONITORING_EVIDENCE_MANIFEST_B64\` is not configured, so production_monitoring_and_alerting evidence was not collected."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Hosted monitoring private evidence skipped because HOSTED_MONITORING_EVIDENCE_MANIFEST_B64 is not configured."

      - name: Local source request dispatch follow-ups
        if: ${{ env.LOCAL_SOURCE_REQUEST_DISPATCH_EVIDENCE_B64 != '' }}
        run: |
          set -euo pipefail
          dispatch_manifest="${RUNNER_TEMP}/local-source-request-dispatch-evidence.json"
          printf '%s' "${LOCAL_SOURCE_REQUEST_DISPATCH_EVIDENCE_B64}" | base64 --decode > "${dispatch_manifest}"
          followup_args=()
          if [ "${FAIL_ON_OVERDUE_LOCAL_SOURCE_FOLLOWUPS}" = "true" ]; then
            followup_args+=(--fail-on-overdue)
          fi
          python scripts/local-source-request-followups.py \
            --completion-evidence-json "${dispatch_manifest}" \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output artifacts/local-source-request-followups.json \
            --sanitized-completion-evidence-output artifacts/local-source-request-dispatch-completion-evidence.json \
            "${followup_args[@]}"

      - name: Skip local source request dispatch follow-ups without manifest
        if: ${{ env.LOCAL_SOURCE_REQUEST_DISPATCH_EVIDENCE_B64 == '' }}
        run: |
          {
            echo "### Hosted private evidence skipped"
            echo "- \`LOCAL_SOURCE_REQUEST_DISPATCH_EVIDENCE_B64\` is not configured, so official request dispatch follow-up evidence was not collected."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Local source request dispatch follow-ups skipped because LOCAL_SOURCE_REQUEST_DISPATCH_EVIDENCE_B64 is not configured."

      - name: Hosted monitoring schedule evidence
        run: |
          set -euo pipefail
          python scripts/hosted_monitoring_schedule_evidence.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --workflow-name "${GITHUB_WORKFLOW}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --cron "${{ github.event.schedule || '7 */6 * * *' }}" \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-output artifacts/hosted-monitoring-schedule-evidence.json \
            --completion-evidence-output artifacts/hosted-monitoring-schedule-completion-evidence.json

      - name: Hosted completion audit
        if: ${{ always() }}
        run: |
          set -euo pipefail
          args=()
          for file in artifacts/*-completion-evidence.json; do
            if [ -f "$file" ]; then
              args+=(--completion-evidence-json "$file")
            fi
          done
          python scripts/local-source-completion-audit.py \
            "${args[@]}" \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output artifacts/hosted-completion-audit.json \
            --markdown-output artifacts/hosted-completion-audit.md

      - name: Upload hosted monitoring artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosted-monitoring-${{ github.run_id }}
          path: |
            artifacts/*.json
            artifacts/*.md
            artifacts/hosted-web-ui/**
          if-no-files-found: warn

      - name: Route hosted monitoring failure issue
        if: ${{ failure() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 3
          script: |
            const fs = require("fs");
            const {
              alertSignature,
              routeAlertIssue,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/route-alert-issue.js`);
            const marker = "[hosted-monitoring-alert]";
            const title = `${marker} Hosted Monitoring failure`;
            const runUrl = [
              process.env.GITHUB_SERVER_URL,
              process.env.GITHUB_REPOSITORY,
              "actions/runs",
              process.env.GITHUB_RUN_ID,
            ].join("/");
            function readJson(path) {
              if (!fs.existsSync(path)) {
                return null;
              }
              try {
                return JSON.parse(fs.readFileSync(path, "utf8"));
              } catch (error) {
                return { _readError: error.message };
              }
            }
            const smoke = readJson("artifacts/hosted-deployment-smoke.json");
            const publicRisk = readJson("artifacts/hosted-public-risk-evidence-smoke.json");
            const hostedWeb = readJson("artifacts/hosted-web-ui-smoke.json");
            function hostedDeploymentSmokeLines() {
              if (!smoke) {
                return [];
              }
              if (smoke._readError) {
                return ["Hosted deployment smoke:", `- read error: ${smoke._readError}`, ""];
              }
              const failures = Array.isArray(smoke.failures) && smoke.failures.length > 0
                ? smoke.failures.slice(0, 5).map(String).join("; ")
                : "none";
              return [
                "Hosted deployment smoke:",
                `- status: ${smoke.status || "unknown"}`,
                `- expected deployment SHA: ${smoke.expected_deployment_sha || "unknown"}`,
                `- health deployment SHA: ${smoke.health?.deployment_sha || "unknown"}`,
                `- ready deployment SHA: ${smoke.ready?.deployment_sha || "unknown"}`,
                `- failures: ${failures.slice(0, 1200)}`,
                "",
              ];
            }
            function publicRiskLines() {
              if (!publicRisk || publicRisk._readError) {
                return [];
              }
              return [
                "Hosted public risk evidence smoke:",
                `- status: ${publicRisk.status || "unknown"}`,
                `- official source state: ${publicRisk.official_source_state || "unknown"}`,
                `- data source mode: ${publicRisk.data_source_mode || "unknown"}`,
                `- contract failures: ${(publicRisk.contract_failures || []).join("; ") || "none"}`,
                `- data source failures: ${(publicRisk.data_source_failures || []).join("; ") || "none"}`,
                "",
              ];
            }
            function hostedWebLines() {
              if (!hostedWeb || hostedWeb._readError) {
                return [];
              }
              return [
                "Hosted Web UI smoke:",
                `- expected tests: ${hostedWeb.stats?.expected ?? "unknown"}`,
                `- unexpected tests: ${hostedWeb.stats?.unexpected ?? "unknown"}`,
                `- flaky tests: ${hostedWeb.stats?.flaky ?? "unknown"}`,
                "",
              ];
            }
            // The signature deliberately excludes run id, sha and timestamps so a
            // recurring failure keeps updating one issue instead of adding a comment
            // on every run.
            const signature = alertSignature([
              process.env.GITHUB_WORKFLOW,
              smoke?.status,
              ...(Array.isArray(smoke?.failures) ? smoke.failures.map(String) : []),
              publicRisk?.status,
              ...(publicRisk?.contract_failures || []),
              ...(publicRisk?.data_source_failures || []),
              hostedWeb?.stats?.unexpected,
              hostedWeb?.stats?.flaky,
            ]);
            const body = [
              "Hosted Monitoring failure detected.",
              "",
              `- run: ${runUrl}`,
              `- workflow: ${process.env.GITHUB_WORKFLOW}`,
              `- event: ${process.env.GITHUB_EVENT_NAME}`,
              `- sha: ${process.env.GITHUB_SHA}`,
              `- failure signature: ${signature}`,
              "",
              ...hostedDeploymentSmokeLines(),
              ...publicRiskLines(),
              ...hostedWebLines(),
              "Artifacts, if uploaded, are attached to the workflow run.",
              "This issue route is public-safe and does not include tokens, manifests, or private evidence refs.",
            ].join("\n");
            await routeAlertIssue({
              github,
              context,
              core,
              title,
              body,
              signature,
              backoffHours: Number(process.env.ALERT_BACKOFF_HOURS || 24),
            });

      - name: Close resolved hosted monitoring failure issue
        if: ${{ success() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 3
          script: |
            const {
              closeAlertIssue,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/route-alert-issue.js`);
            const marker = "[hosted-monitoring-alert]";
            const title = `${marker} Hosted Monitoring failure`;
            const runUrl = [
              process.env.GITHUB_SERVER_URL,
              process.env.GITHUB_REPOSITORY,
              "actions/runs",
              process.env.GITHUB_RUN_ID,
            ].join("/");
            const body = [
              "Hosted Monitoring failure resolved.",
              "",
              `- run: ${runUrl}`,
              `- workflow: ${process.env.GITHUB_WORKFLOW}`,
              `- event: ${process.env.GITHUB_EVENT_NAME}`,
              `- sha: ${process.env.GITHUB_SHA}`,
              "",
              "Closing the stale hosted monitoring failure issue.",
            ].join("\n");
            await closeAlertIssue({ github, context, core, title, body });

      - name: Close resolved schedule watchdog issue
        if: ${{ success() && github.event_name == 'schedule' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 3
          script: |
            const {
              closeAlertIssue,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/route-alert-issue.js`);
            const marker = "[hosted-schedule-watchdog]";
            const title = `${marker} Hosted Monitoring schedule not ready`;
            const runUrl = [
              process.env.GITHUB_SERVER_URL,
              process.env.GITHUB_REPOSITORY,
              "actions/runs",
              process.env.GITHUB_RUN_ID,
            ].join("/");
            const body = [
              "Hosted Monitoring schedule readiness resolved by a successful scheduled run.",
              "",
              `- run: ${runUrl}`,
              `- workflow: ${process.env.GITHUB_WORKFLOW}`,
              `- event: ${process.env.GITHUB_EVENT_NAME}`,
              `- sha: ${process.env.GITHUB_SHA}`,
              "",
              "Closing the stale schedule watchdog issue without waiting for the daily watchdog cadence.",
            ].join("\n");
            await closeAlertIssue({ github, context, core, title, body });

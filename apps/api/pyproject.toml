[project]
name = "flood-risk-api"
version = "0.0.0"
description = "FastAPI backend skeleton for the Flood Risk project."
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1",
  "fastapi>=0.115",
  "psycopg[binary,pool]>=3.2",
  "pyshp>=2.3.1,<3",
  "redis>=5.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "jsonschema>=4.21",
  "mypy>=1.11",
  "pytest>=8.3",
  "pyyaml>=6",
  "ruff>=0.6",
  "types-defusedxml>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "no_repository_seam: skip the autouse repository_service_seam fixture in test_public_contract.py so `_assessment_service` and `_now` stay the real implementations.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
